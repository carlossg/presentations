<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Playwright client and browser sandbox architecture</title>
  <desc id="desc">A labelled agent pod reaches a custom proxy. WS and MCP traffic are routed to separate listeners and browser sessions in its assigned sandbox. Browser navigation originates in the sandbox.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#1473e6"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b4d; font-size: 22px; }
      .heading { font-size: 26px; font-weight: 700; }
      .small { font-size: 19px; fill: #526171; }
      .box { fill: #f0f6fd; stroke: #1473e6; stroke-width: 2; }
      .line { fill: none; stroke: #1473e6; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="580" fill="#fff"/>
  <rect x="615" y="45" width="565" height="370" rx="16" fill="#f7fafc" stroke="#7b8ea5" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="83" class="heading">Assigned browser sandbox</text>
  <rect class="box" x="20" y="155" width="210" height="195" rx="10"/>
  <text x="125" y="197" text-anchor="middle" class="heading">Agent pod</text>
  <text x="125" y="237" text-anchor="middle">Playwright client</text>
  <text x="125" y="279" text-anchor="middle" class="small">playwright-id:</text>
  <text x="125" y="307" text-anchor="middle">alpha</text>
  <rect class="box" x="305" y="155" width="230" height="195" rx="10"/>
  <text x="420" y="195" text-anchor="middle" class="heading">Custom proxy</text>
  <text x="420" y="235" text-anchor="middle">Identify caller</text>
  <text x="420" y="272" text-anchor="middle">Ensure sandbox</text>
  <text x="420" y="309" text-anchor="middle">Forward traffic</text>
  <path class="line" d="M230 255 H298"/>
  <text x="267" y="143" text-anchor="middle" class="small">:9000</text>
  <rect class="box" x="650" y="140" width="225" height="95" rx="8"/>
  <text x="762" y="179" text-anchor="middle">Native Playwright</text>
  <text x="762" y="211" text-anchor="middle" class="small">WebSocket :9222</text>
  <rect class="box" x="650" y="275" width="225" height="95" rx="8"/>
  <text x="762" y="314" text-anchor="middle">@playwright/mcp</text>
  <text x="762" y="346" text-anchor="middle" class="small">HTTP :9223</text>
  <path class="line" d="M535 195 H643"/>
  <text x="589" y="177" text-anchor="middle" class="small">WS</text>
  <path class="line" d="M535 320 H643"/>
  <text x="589" y="302" text-anchor="middle" class="small">HTTP</text>
  <rect class="box" x="935" y="140" width="215" height="95" rx="8"/>
  <text x="1042" y="180" text-anchor="middle">Chromium</text>
  <text x="1042" y="211" text-anchor="middle" class="small">WS browser session</text>
  <rect class="box" x="935" y="275" width="215" height="95" rx="8"/>
  <text x="1042" y="315" text-anchor="middle">Chromium</text>
  <text x="1042" y="346" text-anchor="middle" class="small">MCP browser session</text>
  <path class="line" d="M875 187 H928"/>
  <path class="line" d="M875 322 H928"/>
  <path class="line" d="M1038 415 V480"/>
  <text x="1010" y="451" text-anchor="end" class="small">Navigation originates here</text>
  <rect x="785" y="487" width="390" height="65" rx="8" fill="#e8f5ed" stroke="#21834a" stroke-width="2"/>
  <text x="980" y="528" text-anchor="middle">Allowed target / fixture</text>
  <text x="30" y="470" class="small">Control plane: claims and controller</text>
  <text x="30" y="505" class="small">Data plane: proxy to ready sandbox pod IP</text>
  <text x="30" y="540" class="small">No browser launch in the agent client pod</text>
</svg>
