<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell v0.1.8 Kubernetes architecture</title>
  <desc id="desc">The OpenShell gateway's Kubernetes compute driver creates a Sandbox resource and a separate trusted supervisor pod. The agent-sandbox controller creates the untrusted workload pod. The supervisor initiates an authenticated channel to the workload, which relays agent TCP and DNS requests over that established channel. The supervisor checks policy, injects permitted credentials, and opens approved upstream connections. Enforcing NetworkPolicy prevents direct workload egress. This is upstream architecture, not the demo harness's historical SandboxClaim image adapter.</desc>
  <defs>
    <marker id="control-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#1473e6"/>
    </marker>
    <marker id="data-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#21834a"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b4d; font-size: 22px; }
      .heading { font-size: 25px; font-weight: 700; }
      .small { font-size: 19px; fill: #526171; }
      .label { font-size: 18px; font-weight: 700; fill: #1473e6; }
      .channel-label { font-size: 17px; fill: #526171; }
      .box { fill: #f0f6fd; stroke: #1473e6; stroke-width: 2; }
      .control { fill: none; stroke: #1473e6; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#control-arrow); }
      .data { fill: none; stroke: #21834a; stroke-width: 3; marker-end: url(#data-arrow); }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fff"/>
  <text x="20" y="24" class="label">KUBERNETES CONTROL PLANE</text>
  <rect class="box" x="20" y="55" width="180" height="90" rx="12"/>
  <text x="110" y="91" text-anchor="middle" class="heading">CLI / SDK</text>
  <text x="110" y="124" text-anchor="middle" class="small">Create / manage</text>

  <rect class="box" x="300" y="45" width="350" height="125" rx="12"/>
  <text x="475" y="80" text-anchor="middle" class="heading">OpenShell gateway</text>
  <text x="475" y="117" text-anchor="middle">Kubernetes compute driver</text>
  <text x="475" y="150" text-anchor="middle" class="small">Policy + providers + sessions</text>
  <path class="control" d="M200 100 H293"/>

  <rect class="box" x="790" y="45" width="390" height="125" rx="12"/>
  <text x="985" y="80" text-anchor="middle" class="heading">Sandbox CR + controller</text>
  <text x="985" y="117" text-anchor="middle">agent-sandbox</text>
  <text x="985" y="150" text-anchor="middle" class="small">Reconcile workload pod</text>
  <path class="control" d="M650 100 H783"/>
  <text x="720" y="80" text-anchor="middle" class="small">create CR</text>

  <path class="control" d="M475 170 V285 H325 V323"/>
  <text x="495" y="233" class="small">Supervisor + PVC + network fence</text>
  <text x="495" y="263" class="small">Policy / credentials / logs</text>
  <path class="control" d="M985 170 V285 H1145 V323"/>
  <text x="1003" y="233" class="small">Manage workload</text>
  <text x="1003" y="263" class="small">pod lifecycle</text>

  <text x="475" y="311" text-anchor="middle" class="label">TRUSTED SUPERVISOR</text>
  <rect x="300" y="330" width="350" height="190" rx="12" fill="#e8f5ed" stroke="#21834a" stroke-width="2"/>
  <text x="475" y="369" text-anchor="middle" class="heading">Supervisor pod</text>
  <text x="475" y="410" text-anchor="middle">Policy + DNS</text>
  <text x="475" y="451" text-anchor="middle">Inject provider credentials</text>
  <text x="475" y="492" text-anchor="middle" class="small">Open approved connections</text>

  <text x="985" y="311" text-anchor="middle" class="label" style="fill:#a65a14">UNTRUSTED WORKLOAD</text>
  <rect x="790" y="330" width="390" height="190" rx="12" fill="#fff6e9" stroke="#bc7400" stroke-width="2"/>
  <text x="985" y="369" text-anchor="middle" class="heading">Workload pod</text>
  <text x="985" y="410" text-anchor="middle">Agent + sandbox process</text>
  <text x="985" y="451" text-anchor="middle" class="small">Non-root / Landlock / seccomp</text>
  <text x="985" y="492" text-anchor="middle" class="small">No direct network egress</text>

  <text x="720" y="387" text-anchor="middle" class="channel-label">Mediated</text>
  <text x="720" y="410" text-anchor="middle" class="channel-label">request flow</text>
  <path class="data" d="M790 435 H657"/>
  <text x="720" y="465" text-anchor="middle" class="channel-label">TLS + JWT</text>
  <text x="720" y="488" text-anchor="middle" class="channel-label">HTTP/2</text>

  <rect x="20" y="360" width="190" height="130" rx="12" fill="#e8f5ed" stroke="#21834a" stroke-width="2"/>
  <text x="115" y="398" text-anchor="middle" class="heading">Approved</text>
  <text x="115" y="430" text-anchor="middle" class="heading">services</text>
  <text x="115" y="467" text-anchor="middle" class="small">APIs / LLMs</text>
  <path class="data" d="M300 425 H217"/>
  <text x="255" y="403" text-anchor="middle" class="channel-label">Allowed</text>
  <text x="255" y="457" text-anchor="middle" class="channel-label">egress</text>

  <text x="600" y="557" text-anchor="middle" class="small">An enforcing CNI + NetworkPolicy blocks direct workload egress.</text>
  <text x="600" y="587" text-anchor="middle" class="channel-label">Green: logical requests over a supervisor-initiated channel, then approved egress. Dashed blue: lifecycle / management.</text>
</svg>
