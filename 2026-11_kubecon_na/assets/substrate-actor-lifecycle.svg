<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent Substrate actor creation, request routing, and suspend/resume</title>
  <desc id="desc">An ActorTemplate produces a golden snapshot. CreateActor registers a suspended actor referencing that snapshot. An incoming request causes atenet-router to call ResumeActor. The control plane assigns a ready worker and atelet plus ateworker restore the snapshot. Traffic is forwarded through atunnel to the running actor. Explicit SuspendActor checkpoints the actor and frees the worker. A later request resumes the actor from its latest snapshot. Asynchronous suspension is not durable until background upload completes.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#1473e6"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b4d; font-size: 23px; }
      .heading { font-size: 26px; font-weight: 700; }
      .small { font-size: 20px; fill: #526171; }
      .box { fill: #f0f6fd; stroke: #1473e6; stroke-width: 2; }
      .line { fill: none; stroke: #1473e6; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fff"/>
  <rect class="box" x="20" y="35" width="325" height="170" rx="12"/>
  <text x="182" y="80" text-anchor="middle" class="heading">1. Prepare template</text>
  <text x="182" y="124" text-anchor="middle">Boot golden workload</text>
  <text x="182" y="162" text-anchor="middle" class="small">Capture starting snapshot</text>
  <rect class="box" x="430" y="35" width="325" height="170" rx="12"/>
  <text x="592" y="80" text-anchor="middle" class="heading">2. CreateActor</text>
  <text x="592" y="124" text-anchor="middle">Record starts SUSPENDED</text>
  <text x="592" y="162" text-anchor="middle" class="small">References golden snapshot</text>
  <rect class="box" x="840" y="35" width="325" height="170" rx="12"/>
  <text x="1002" y="80" text-anchor="middle" class="heading">3. Incoming request</text>
  <text x="1002" y="124" text-anchor="middle">atenet-router calls API</text>
  <text x="1002" y="162" text-anchor="middle" class="small">ResumeActor + resolve</text>
  <path class="line" d="M345 120 H423"/>
  <path class="line" d="M755 120 H833"/>
  <path class="line" d="M1002 205 V308"/>
  <text x="1018" y="263" class="small">RESUMING</text>

  <rect class="box" x="840" y="315" width="325" height="170" rx="12"/>
  <text x="1002" y="358" text-anchor="middle" class="heading">4. Assign + restore</text>
  <text x="1002" y="400" text-anchor="middle">atelet + ateworker</text>
  <text x="1002" y="438" text-anchor="middle" class="small">Ready worker + sandbox runtime</text>
  <text x="1002" y="468" text-anchor="middle" class="small">Local cache or durable snapshot</text>
  <rect x="430" y="315" width="325" height="170" rx="12" fill="#e8f5ed" stroke="#21834a" stroke-width="2"/>
  <text x="592" y="358" text-anchor="middle" class="heading">5. Serve request</text>
  <text x="592" y="400" text-anchor="middle">RUNNING actor</text>
  <text x="592" y="438" text-anchor="middle" class="small">Router forwards via atunnel</text>
  <text x="592" y="468" text-anchor="middle" class="small">Application handles request</text>
  <rect class="box" x="20" y="315" width="325" height="170" rx="12"/>
  <text x="182" y="358" text-anchor="middle" class="heading">6. SuspendActor</text>
  <text x="182" y="400" text-anchor="middle">Checkpoint -&gt; SUSPENDED</text>
  <text x="182" y="438" text-anchor="middle" class="small">Explicit API / policy action</text>
  <text x="182" y="468" text-anchor="middle" class="small">Worker becomes available</text>
  <path class="line" d="M840 400 H762"/>
  <path class="line" d="M430 400 H352"/>
  <text x="798" y="381" text-anchor="middle" class="small">ready</text>
  <text x="388" y="381" text-anchor="middle" class="small">later</text>
  <path class="line" d="M182 485 V535 H1185 V120 H1172" stroke-dasharray="8 6"/>
  <text x="660" y="527" text-anchor="middle" class="small">Next request: resume from the actor's latest snapshot</text>
  <rect x="20" y="558" width="1145" height="36" rx="6" fill="#fff6e9"/>
  <text x="592" y="583" text-anchor="middle" class="small">Async suspend: local checkpoint first; durable recovery only after background upload completes.</text>
</svg>
