<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">

    <title>Agentic Sites: Building Hyper Personalized Websites</title>

    <meta name="description" content="Agentic Sites: Building Hyper Personalized Websites">
    <meta name="author" content="Carlos Sanchez">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">

    <link rel="stylesheet" href="../dist/reveal.css">
    <link rel="stylesheet" href="../dist/theme/white.css" id="theme">
    <link rel="stylesheet" href="../css/csanchez.css">
    <link rel="stylesheet" href="./presentation.css">
    <link rel="stylesheet" href="../dist/plugin/highlight/zenburn.css">
  </head>

  <body>

    <div class="reveal">
      <div class="slides">
        <section data-markdown="./index.md" data-separator-vertical="^\n----\n$">
        </section>
      </div>
    </div>

    <script src="../dist/reveal.js"></script>
    <script src="../dist/plugin/markdown.js"></script>
    <script src="../dist/plugin/highlight.js"></script>
    <script src="../dist/plugin/notes.js"></script>

    <script>
      Reveal.initialize({
        controls: false,
        progress: false,
        history: true,
        center: false,
        width: 1440,
        height: 810,
        margin: 0,
        // navigationMode: 'linear',
        transition: 'none',
        backgroundTransition: 'none',
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
      });
    </script>

  </body>
</html>
